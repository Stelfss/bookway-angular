<section class="bookshelf-wrapper" aria-label="Minha estante">
  <h2 class="bookshelf-title">Minha Estante</h2>

  <div *ngIf="loading" class="profile-state" role="status">
    <div class="state-spinner" aria-hidden="true"></div>
    <p>Carregando sua estante...</p>
  </div>

  <p *ngIf="!loading && erro" class="shelf-error" role="alert">{{ erro }}</p>
  <p *ngIf="!loading && !erro && feedback" class="shelf-feedback" role="status">{{ feedback }}</p>

  <div *ngIf="!loading && !erro && livros.length > 0" class="grid-estante-livros">
    <div class="container-estante-livros" *ngFor="let livro of livros">
      <div class="livro-estante">
        <img
          [src]="livro.capa_url || '/imagens/padrao.jpg'"
          [alt]="'Capa de ' + livro.titulo"
          class="livro-wrap"
        />
        <button
          type="button"
          class="btn-remove-book"
          [class.confirming]="confirmandoRemocao === livro.id"
          [title]="confirmandoRemocao === livro.id ? 'Clique novamente para confirmar' : 'Remover da estante'"
          [attr.aria-label]="'Remover ' + livro.titulo + ' da estante'"
          (click)="clicarRemover(livro)"
        >
          <img src="/imagens/Vetores/deletevetor.svg" alt="" aria-hidden="true" />
        </button>
      </div>
      <div class="book-info">
        <h3>{{ livro.titulo }}</h3>
        <p>{{ livro.autor || 'Autor desconhecido' }}</p>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && !erro && livros.length === 0" class="empty-state">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
    </svg>
    <p class="empty-headline">Sua estante ainda está vazia! 📚</p>
    <p class="empty-subtext">Explore o acervo e salve seus livros favoritos para encontrá-los aqui.</p>
    <a routerLink="/home" class="btn-explorar">Explorar livros para adicionar</a>
  </div>
</section>
