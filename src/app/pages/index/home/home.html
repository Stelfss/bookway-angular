<section class="conteudo">
  <!-- CARROSSEL HERO -->
  <div class="hero-carousel" id="hero-carousel">
    <div class="hero-carousel-track" id="hero-track">
      <div 
        *ngFor="let slide of heroSlides; let i = index" 
        class="hero-slide" 
        [class.active]="i === currentHeroIndex">
        <img [src]="slide.imagem" [alt]="slide.titulo" />
        <div class="hero-content">
          <span class="hero-badge">{{ slide.badge }}</span>
          <h2>{{ slide.titulo }}</h2>
          <p>{{ slide.descricao }}</p>
        </div>
      </div>
    </div>

    <div class="hero-controls">
      <button type="button" class="hero-arrow" (click)="goHeroPrev()">
        <img src="./imagens/Vetores/SetaEsquerdaVetor.svg" alt="Anterior" class="sidebar-icon" />
      </button>

      <div class="hero-indicators">
        <span 
          *ngFor="let slide of heroSlides; let i = index" 
          class="indicator" 
          [class.active]="i === currentHeroIndex"
          (click)="setHeroIndex(i)">
        </span>
      </div>

      <button type="button" class="hero-arrow" (click)="goHeroNext()">
        <img src="./imagens/Vetores/SetaDireitaVetor.svg" alt="Próximo" class="sidebar-icon" />
      </button>
    </div>
  </div>

  <!-- VISTOS RECENTEMENTE -->
  <div class="row" *ngIf="livrosEmAndamento.length > 0">
    <h1>Vistos Recentemente</h1>
    <section class="secao-horizontal">
      <button type="button" class="btn-scroll-left" (click)="scrollLeft(lendoRow)">
        <img src="./imagens/Vetores/SetaEsquerdaVetor.svg" alt="Esquerda" class="sidebar-icon" />
      </button>

      <div class="book-row" #lendoRow>
        <div class="book-card" *ngFor="let item of livrosEmAndamento" (click)="openBookModal(item.livro)">
          <img [src]="item.livro.capa" [alt]="item.livro.titulo" class="book-cover" />
          <div class="book-info">
            <h3>{{ item.livro.titulo }}</h3>
            <p>{{ item.livro.autor }}</p>
            <div class="progress-bar">
              <div class="progress-fill" [style.width.%]="item.porcentagem"></div>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="btn-scroll-right" (click)="scrollRight(lendoRow)">
        <img src="./imagens/Vetores/SetaDireitaVetor.svg" alt="Direita" class="sidebar-icon" />
      </button>
    </section>
  </div>

  <!-- COMUNIDADES FAMOSAS -->
  <div class="row" *ngIf="comunidades.length > 0">
    <div class="titulocomunidade">
      <h1>Comunidades famosas</h1>
    </div>
    <div class="comunidade-row">
      <div class="comunidade-card" *ngFor="let comm of comunidades" (click)="openCommunityModal(comm)">
        <img [src]="comm.capa" [alt]="comm.titulo" />
        <div class="comunidade-info">
          <h3>{{ comm.titulo }}</h3>
          <p>{{ comm.membros }} membros</p>
        </div>
      </div>
    </div>
  </div>

  <!-- RECOMENDAÇÕES -->
  <div class="row" *ngIf="livrosRecomendados.length > 0">
    <h1>Recomendações</h1>
    <section class="secao-horizontal">
      <button type="button" class="btn-scroll-left" (click)="scrollLeft(recomendacoesRow)">
        <img src="./imagens/Vetores/SetaEsquerdaVetor.svg" alt="Esquerda" class="sidebar-icon" />
      </button>

      <div class="book-row" #recomendacoesRow>
        <div class="book-card" *ngFor="let livro of livrosRecomendados" (click)="openBookModal(livro)">
          <img [src]="livro.capa" [alt]="livro.titulo" class="book-cover" />
          <div class="book-info">
            <h3>{{ livro.titulo }}</h3>
            <p>{{ livro.autor }}</p>
          </div>
        </div>
      </div>

      <button type="button" class="btn-scroll-right" (click)="scrollRight(recomendacoesRow)">
        <img src="./imagens/Vetores/SetaDireitaVetor.svg" alt="Direita" class="sidebar-icon" />
      </button>
    </section>
  </div>
</section>
