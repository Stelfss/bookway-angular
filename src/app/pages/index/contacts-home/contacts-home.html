<main class="conteudo-publico">
  <section class="contact-wrapper">
    
    <!-- Imagem Vetorial de Contato -->
    <div class="contact-image-section">
      <img src="/imagens/Vetores/ContatosVetor.svg" alt="Ilustração de Contato" class="img-contato">
    </div>

    <!-- Informações de Contato -->
    <div class="contact-info-section">
      <div class="contact-container1">
        <h1>Nos contate</h1>
        
        <div class="info-group">
          <p><strong>Email:</strong> BookWay2025@gmail.com</p>
          <p><strong>Telefone:</strong> +55 71 94279-0263</p>
        </div>
        
        <div>
          <a href="#" (click)="abrirChat($event)" class="chat-link">Entrar em um chat</a>
        </div>
        
        <a routerLink="/faq-home">
          <button class="contact-bttn">Perguntas Frequentes</button>
        </a>
      </div>

      <div class="contact-container2">
        <h3>Outras Formas</h3>
        <div class="info-vetor">
          <a href="https://www.instagram.com/bookway" target="_blank" rel="noopener noreferrer">
            <img src="/imagens/Vetores/InstagramLogo.svg" alt="Instagram" class="trocarcor">
          </a>
          <a href="https://www.facebook.com/bookway" target="_blank" rel="noopener noreferrer">
            <img src="/imagens/Vetores/FacebookLogo.svg" alt="Facebook" class="trocarcor">
          </a>
          <a href="https://twitter.com/bookway" target="_blank" rel="noopener noreferrer">
            <img src="/imagens/Vetores/XLogo.svg" alt="Twitter" class="trocarcor">
          </a>
        </div>
      </div>
    </div>

  </section>
