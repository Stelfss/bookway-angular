<header class="main-header">
  <div class="header-container">
    <div class="logo">
      <a routerLink="/" id="logo">
        <img
          src="/imagens/Vetores/logovetorizada2.svg"
          alt="Logo"
          height="55px"
          id="imglogo"
        />
      </a>
    </div>

    <nav class="center-nav">
      <ul>
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a></li>
        <li><a href="/#recursos">Recursos</a></li>
        <li><a href="/#comunidades">Comunidades</a></li>
        <li><a href="/#destaques">Destaques</a></li>
      </ul>
    </nav>

    <div class="auth-buttons">
      <a routerLink="/login" class="btn-login">Entrar</a>
      <a routerLink="/singin" class="btn-register">Criar</a>
    </div>
  </div>
</header>

<router-outlet></router-outlet>

<footer class="main-footer">
  <div class="footer-container">
    <p>&copy; 2026 Bookway. Desenvolvido para conectar mentes literárias.</p>
    <ul class="footer-links">
      <li><a routerLink="/about-login">Sobre</a></li>
      <li><a routerLink="/faq-home">Central de Ajuda</a></li>
      <li><a routerLink="/contacts-home">Contato</a></li>
    </ul>
  </div>
</footer>
